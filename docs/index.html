<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hataff Security Systems (Pvt) Ltd. | Vigilant by Duty, Trusted by Choice</title>
    <meta name="description" content="Hataff Security Systems (Pvt) Ltd. is a Lahore-based premier private security contractor built on discipline, vigilance, and responsibility since 1995." />
    <meta property="og:title" content="Hataff Security Systems (Pvt) Ltd." />
    <meta property="og:description" content="Vigilant by duty. Trusted by choice. Complete security solutions for commercial, industrial, and residential sectors." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // 1. Ensure trailing slash for GitHub Pages repo URLs (avoids 404 on relative ./assets/)
      if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      }

      // 2. Catch and display errors on screen instead of blank white screen
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        var errBox = document.getElementById('deploy-error-box');
        if (root && (!root.children.length || errBox)) {
          var msg = (e && e.message) ? e.message : 'Script loading error';
          var filename = (e && e.filename) ? e.filename : '';
          var html = '<div id="deploy-error-box" style="font-family:sans-serif;padding:24px;max-width:680px;margin:40px auto;background:#fff;border:2px solid #b91c1c;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.1);color:#1c1917;">' +
            '<h2 style="color:#b91c1c;margin:0 0 12px;font-size:20px;font-weight:700;">Hataff Security App - Loading Issue Detected</h2>' +
            '<p style="margin:0 0 12px;font-size:14px;color:#44403c;">' + msg + '</p>' +
            (filename ? '<p style="font-size:12px;color:#78716c;word-break:break-all;">Source: ' + filename + '</p>' : '') +
            '<div style="margin-top:16px;padding:12px;background:#fef2f2;border-radius:8px;font-size:13px;line-height:1.5;color:#991b1b;">' +
            '<strong>How to fix on GitHub Pages:</strong><br>' +
            '1. Go to your GitHub repository > <strong>Settings</strong> > <strong>Pages</strong>.<br>' +
            '2. Under <strong>Build and deployment</strong>, change <strong>Source</strong> to <strong>GitHub Actions</strong>.<br>' +
            '3. Or if deploying from branch, ensure the pre-built <code>dist/</code> or <code>docs/</code> folder is selected.' +
            '</div></div>';
          root.innerHTML = html;
        }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-DblLMRYH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-IEZKnap5.css">
  </head>
  <body class="bg-[#FBF9F5] text-neutral-900 antialiased selection:bg-[#203a27] selection:text-white">
    <div id="root">
      <!-- Loading indicator shown while React bundle initializes -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#18281c;color:#f5f2eb;">
        <div style="text-align:center;padding:20px;">
          <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#c2ab8a;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
          <div style="font-size:18px;font-weight:700;letter-spacing:1px;">HATAFF SECURITY SYSTEMS</div>
          <div style="font-size:12px;opacity:0.7;margin-top:4px;">Vigilant by Duty, Trusted by Choice</div>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </body>
</html>
